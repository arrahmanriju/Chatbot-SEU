services:
  api:
    build: .
    command: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    volumes:
      - ./vectorstore:/app/vectorstore
      - models:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    build: .
    environment:
      SEU_API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "8501:8501"
volumes:
  models:
